/* Layout: lista de proyectos y servicios con pestañas (Proyectos · Por crear · Pedidos de suministro) y ficha con pestañas.

:root {

}

  --ok-bg: #0e3324; --ok-ink: #8fe3b6; --warn-bg: #3a2a0c; --warn-ink: #ffd28a; --err-bg: #3d1519; --err-ink: #ff7a80;
  --approval: #a98bff; --approval-soft: #221a45; --off-bg: #132439; --off-ink: #5f738c; --svc: #43d3ea; --svc-soft: #0d3340; --done: #2fd3ec;
  --shadow: 0 12px 32px rgba(0,0,0,.55); --shadow-sm: 0 2px 8px rgba(0,0,0,.4); color-scheme: dark; } }

.top b { font-weight: 600; }
.top .right { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 12px; }

.wrap { max-width: 1240px; margin: 0 auto; padding-block: 24px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }

.pill.warn { background: var(--warn-bg); color: var(--warn-ink); }

/* Tabla */
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); overflow: hidden; }
.box-h { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line-2); }
.box-h h3 { font-size: 15px; font-weight: 600; }
.box-b { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.scroll-x { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; }

/* Bandeja */
.inbox { display: flex; flex-direction: column; gap: 10px; }
.inq { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 14px 16px; }
.inq .q-ic { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--primary-soft); color: var(--primary); }
.inq .q-ic.sup { background: var(--warn-bg); color: var(--warn-ink); }
.inq .q-ic.add { background: var(--svc-soft); color: var(--svc); }
.inq h4 { font-size: 14.5px; font-weight: 600; }
.inq .meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r-surf); background: var(--surface); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty h3 { color: var(--ink); font-size: 16px; }

/* Ficha */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; align-self: flex-start; }
.back:hover { color: var(--ink); }
.f-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 18px 20px; }
.f-title { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 360px; }
.f-title h1 { font-size: 22px; font-weight: 600; line-height: 1.25; }
.f-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); align-items: center; }
.f-doc { display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
.f-doc .big { font-size: 26px; font-weight: 600; line-height: 1; }
.f-doc small { color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.dl { display: grid; grid-template-columns: 150px 1fr; gap: 8px 14px; font-size: 13px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; min-width: 0; }

/* Metodologia */
.journey { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); overflow: hidden; }
.jstep { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line-2); text-align: left; position: relative; }
.jstep:last-child { border-right: 0; }
.jstep[aria-pressed="true"] { background: var(--primary-soft); }
.jstep .jn { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.jstep b { font-size: 14px; }
.jstep .jf { font-size: 12px; color: var(--muted); }
.jstep.done .jf { color: var(--cyan-ink); font-weight: 600; }
.jstep .bar { margin-top: 2px; }
.acts { display: flex; flex-direction: column; }
.act { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
.act:last-child { border-bottom: 0; }
.act.na { opacity: .55; }
.ty { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; border: 1.5px solid var(--off-ink); color: var(--off-ink); }
.ty.done { background: var(--done); border-color: var(--done); color: #04223a; }
.ty.tip { border-style: dashed; border-radius: 50%; font-style: italic; }
.act-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.act-main b { font-size: 13.5px; font-weight: 500; }
.act-main .sub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.act-ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.tog { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; font-size: 11.5px; }
.tog button { padding: 3px 10px; }
.tog button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend .ty { width: 20px; height: 20px; font-size: 10px; border-radius: 5px; }

/* Wizard de metodologia [PROPUESTA 27-oct] */
.wz-phs { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.wz-ph { text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-surf); background: var(--surface); display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, box-shadow .15s; }
.wz-ph:hover { border-color: var(--bright); }
.wz-ph[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 1px var(--primary); }
.wz-ph .jn { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.wz-ph b { font-size: 14px; }
.wz-ph .jf { font-size: 12px; color: var(--muted); }
.wz-ph.done .jf { color: var(--cyan-ink); font-weight: 600; }
.wz-dots { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.wz-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--off-bg); border: 1.5px solid var(--off-ink); }
.wz-dots i.on { background: var(--done); border-color: var(--done); }
.wz-line { display: flex; overflow-x: auto; padding: 12px 6px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); scrollbar-width: thin; }
.wz-n { flex: 1 0 108px; min-width: 108px; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; padding: 4px 4px 0; }
.wz-n::before { content: ""; position: absolute; top: 21px; z-index: 0; right: 50%; width: 100%; height: 2px; background: var(--line); }
.wz-n:first-child::before { display: none; }
.wz-n.pd::before { background: var(--done); }
.wz-c { position: relative; z-index: 1; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); background: var(--off-bg); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--muted); transition: transform .15s, box-shadow .15s; }
.wz-n:hover .wz-c { transform: scale(1.07); }
.wz-n.done .wz-c { background: var(--done); border-color: var(--done); color: #04223a; }
.wz-n.tip .wz-c { border-style: dashed; font-style: italic; }
.wz-n.na .wz-c { border-style: dashed; border-color: var(--off-ink); background: var(--surface); color: var(--off-ink); text-decoration: line-through; }
.wz-n.na .wz-cap { opacity: .6; }
.wz-n.cur .wz-c { background: #ffe9a6; border-color: #e3a008; color: #5a3a00; box-shadow: 0 0 0 4px rgba(227,160,8,.24); }
.wz-cap { font-size: 11.5px; line-height: 1.3; text-align: center; color: var(--muted); max-width: 124px; overflow-wrap: anywhere; padding-bottom: 4px; }
.wz-n.cur .wz-cap { color: var(--ink); font-weight: 600; }
.wz-panel { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid #e3a008; border-radius: var(--r-surf); animation: rise .2s ease-out; }
.wz-panel.done { border-left-color: var(--done); }
.wz-panel.na { border-left-color: var(--off-ink); }
.wz-h { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.wz-t { flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.wz-t small { font-size: 12px; color: var(--muted); }
.wz-t h3 { font-size: 17px; font-weight: 600; }
.wz-hr { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.wz-b { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.wz-intro { font-size: 13.5px; }
.wz-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); align-items: center; }
.wz-meta b { color: var(--ink); font-weight: 500; }
.wz-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.wz-row:last-child { border-bottom: 0; }
.wz-lb { font-size: 13.5px; }
.okb { border: 1px solid var(--line); background: var(--off-bg); border-radius: var(--r-ctl); padding: 6px 16px; font-size: 13px; font-weight: 500; min-width: 64px; }
.okb[aria-pressed="true"] { background: var(--ok-bg); color: var(--ok-ink); border-color: transparent; }
.okb:disabled { cursor: default; }
.wz-flds { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.wz-up { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.wz-up:last-child { border-bottom: 0; }
.wz-up .wz-lb { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.wz-file { display: flex; gap: 8px; align-items: center; min-height: 38px; padding: 6px 12px; border: 1px dashed var(--line); border-radius: var(--r-ctl); background: var(--surface-2); min-width: 0; font-size: 12.5px; }
.wz-file.on { border-style: solid; background: var(--surface); }
.wz-file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.wz-file small { color: var(--muted); white-space: nowrap; margin-left: auto; }
.wz-ups { display: flex; gap: 10px; align-items: center; }
.wz-mod { border: 1px solid var(--line); border-radius: var(--r-surf); padding: 14px 16px; background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; }
.wz-mod.ok { border-color: var(--done); }
.wz-mod-h { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.wz-mod ul { margin: 0; padding-left: 18px; font-size: 13.5px; display: flex; flex-direction: column; gap: 3px; }
.wz-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.wz-vers { border-top: 1px solid var(--line-2); padding-top: 10px; }
.wz-vers summary { cursor: pointer; font-size: 13px; font-weight: 500; }
.wz-v { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; font-size: 12.5px; border-bottom: 1px solid var(--line-2); }
.wz-v:last-child { border-bottom: 0; }
.wz-f { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line-2); background: var(--surface-2); border-radius: 0 0 var(--r-surf) var(--r-surf); }
.wz-stamp { font-size: 12.5px; color: var(--muted); }
.wz-stamp b { color: var(--cyan-ink); }
.wz-nav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
/* Acta de inicio interna [PROPUESTA 27-oct] */
.ac-bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-surf); }
.ac-bar .note { flex: 1 1 220px; }
.ac-lang { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-ctl); overflow: hidden; }
.ac-lang button { padding: 6px 14px; font-size: 12.5px; font-weight: 600; background: var(--surface); }
.ac-lang button[aria-pressed="true"] { background: var(--primary); color: #fff; }
.ac-sec { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.ac-sec > * { align-self: stretch; }
.ac-sec > .btn { align-self: flex-start; }
.ac-sec h4 { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--primary); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding-bottom: 6px; border-bottom: 1px solid var(--line-2); margin: 0; }
.ac-sec h4 small { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); font-size: 12px; }
.ac-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 18px; margin: 0; }
.ac-kv dt { font-size: 11.5px; color: var(--muted); }
.ac-kv dd { margin: 0; font-size: 13.5px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ac-3 { display: grid; grid-template-columns: 170px 130px minmax(0, 1fr); gap: 12px; }
.ac-tb { display: flex; flex-direction: column; gap: 6px; }
.ac-hd, .ac-r { display: grid; gap: 8px; align-items: center; }
.ac-hd { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.ac-att .ac-hd, .ac-att .ac-r { grid-template-columns: 1.5fr .5fr 1.1fr 1.1fr 1.7fr 36px; }
.ac-dv .ac-hd, .ac-dv .ac-r { grid-template-columns: 1.3fr 2fr .6fr 36px; }
.ac-cm .ac-hd, .ac-cm .ac-r { grid-template-columns: 2.4fr 1.2fr 1fr 36px; }
.ac-c { min-width: 0; }
.ac-ag { display: grid; grid-template-columns: 24px minmax(0, 1fr) 36px; gap: 8px; align-items: center; }
.ac-ag b { font-size: 12px; color: var(--muted); text-align: center; }
.ac-legal { background: var(--surface-2); border: 1px solid var(--line); border-left: 4px solid var(--cyan); border-radius: var(--r-surf); padding: 12px 14px; font-size: 12.5px; color: var(--muted); gap: 6px; }
.ac-legal p { margin: 0; }
.ac-mail { border-top: 1px solid var(--line-2); padding-top: 14px; }
.ac-rc { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 6px 14px; }
.ac-chk { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.ac-chk small { color: var(--muted); }
.ac-log { border: 1px solid var(--line); border-radius: var(--r-surf); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.ac-lg { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; }
.ac-lg small { color: var(--muted); word-break: break-all; }
.wz-vr { display: flex; gap: 10px; align-items: center; }
@media (max-width: 720px) {
  .ac-hd { display: none; }
  .ac-3 { grid-template-columns: 1fr 1fr; }
  .ac-3 .field:last-child { grid-column: 1 / -1; }
  .ac-att .ac-r, .ac-dv .ac-r, .ac-cm .ac-r { grid-template-columns: 1fr 1fr; padding: 10px; border: 1px solid var(--line-2); border-radius: var(--r-ctl); }
  .ac-c[data-l]::before { display: block; content: attr(data-l); font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .ac-c.ac-x { grid-column: 1 / -1; }
  .ac-att .ac-c:first-child, .ac-att .ac-c:nth-child(5), .ac-dv .ac-c:first-child, .ac-dv .ac-c:nth-child(2), .ac-cm .ac-c:first-child { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  .wz-phs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .wz-ph { padding: 10px 12px; }
  .wz-row { grid-template-columns: minmax(0, 1fr) auto; }
  .wz-row .wz-lnk { grid-column: 1 / -1; order: 3; justify-self: start; }
  .wz-up { grid-template-columns: 1fr; }
  .wz-cap { display: none; }
  .wz-n { flex-basis: 56px; min-width: 56px; }
  .wz-h, .wz-b, .wz-f { padding-left: 14px; padding-right: 14px; }
}

/* Settings */
.set-wide { grid-column: 1 / -1; }
.phs-t { min-width: 0; }
.phs-t td { padding: 9px 14px; }
.phs-t tr.ph-big td { background: var(--warn-bg); }
.split-f { display: flex; flex-direction: column; gap: 10px; padding: 6px 0; }
.set-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lb { font-size: 12.5px; font-weight: 500; color: var(--muted); }
.field .err { font-size: 12px; color: var(--err-ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .field { flex: 1 1 140px; }
.member { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.member:last-child { border-bottom: 0; }
.member .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.member .who small { color: var(--muted); font-size: 11.5px; }
.member.off .who span, .member.off .who small { color: var(--off-ink); }
.member.off .av img { filter: grayscale(1); opacity: .55; }
.member.off .av { opacity: .8; }
.inact-t { align-self: flex-start; margin: 8px 0 2px; font-size: 12.5px; }
.tsw { display: inline-flex; align-items: center; gap: 8px; flex: none; font-size: 12px; color: var(--muted); }
.tsw-k { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--line); flex: none; }
.tsw-k::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform .15s; }
.tsw[aria-checked="true"] .tsw-k { background: var(--bright); }
.tsw[aria-checked="true"] .tsw-k::after { transform: translateX(14px); }
.tsw[aria-checked="true"] .tsw-l { color: var(--bright); }
@media (max-width: 520px) { .tsw-l { display: none; } }
.log { display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; }
.log div { display: grid; grid-template-columns: 110px 1fr; gap: 10px; }
.log time { color: var(--muted); }
.cat-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.cat-opt { border: 1.5px solid var(--line); border-radius: var(--r-ctl); padding: 10px 12px; text-align: left; display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
.cat-opt b { font-size: 13.5px; }
.cat-opt span { font-size: 12px; color: var(--muted); }
.cat-opt[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }
.cat-opt:disabled { opacity: .55; }

.ghost-card { border: 1px dashed var(--line); border-radius: var(--r-surf); padding: 16px; background: var(--surface-2); color: var(--off-ink); display: flex; flex-direction: column; gap: 6px; }
.ghost-card h4 { color: var(--muted); font-size: 14px; }

/* Dialogo */
.scrim { position: fixed; inset: 0; background: rgba(0,28,63,.45); z-index: 40; display: flex; justify-content: flex-end; }
.sheet { background: var(--bg); width: min(620px, 100%); height: 100%; overflow-y: auto; display: flex; flex-direction: column; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-h { display: flex; gap: 12px; align-items: flex-start; padding: 18px 20px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
.sheet-h h2 { font-size: 18px; font-weight: 600; }
.sheet-h p { font-size: 12.5px; color: var(--muted); }
.sheet-h .x { margin-left: auto; width: 34px; height: 34px; border-radius: var(--r-ctl); display: flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
.sheet-b { padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; }
.sheet-f { margin-top: auto; padding: 14px 20px; background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: 0; }
.src { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 12px 14px; }
.src small { color: var(--muted); display: block; font-size: 11px; }
.confirm { border: 1px solid var(--warn-ink); background: var(--warn-bg); color: var(--warn-ink); border-radius: var(--r-ctl); padding: 10px 12px; font-size: 12.5px; display: flex; flex-direction: column; gap: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: var(--r-ctl); font-size: 13px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.view-in { animation: rise .25s ease-out; }
@keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
