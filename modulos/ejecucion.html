<style>
/* Layout: cabecera (sin pestanas: Semanas bloqueadas vive en Configuracion), carrusel de semanas y tablero persona x semana.
   Tokens del Ecosistema (design/planeacion-v1). */
:root {
  color-scheme: light;
  --font: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --navy: #001c3f; --bright: #0a58eb; --cyan: #00dcfa; --cyan-ink: #007f93;
  --bg: #f2f5f9; --surface: #fff; --surface-2: #f6f8fb; --ink: #001c3f; --muted: #556578; --line: #dbe2ea; --line-2: #eef2f6;
  --primary: #002473; --primary-ink: #fff; --primary-soft: #e8eefc; --focus: #0a58eb;
  --ok-bg: #e5f7ee; --ok-ink: #145a37; --warn-bg: #fff4e0; --warn-ink: #7a4a00; --err-bg: #fbeaeb; --err-ink: #b0353c;
  --approval: #7543ff; --approval-soft: #f1ecff; --off-bg: #e9edf2; --off-ink: #8593a5;
  --res: #7aa7ff; --res-soft: #e8f0ff;
  --shadow: 0 12px 32px rgba(0,28,63,.18); --shadow-sm: 0 2px 8px rgba(0,28,63,.08);
  --r-ctl: 8px; --r-surf: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #07111f; --surface: #0d1b2f; --surface-2: #112339; --ink: #e7eef7; --muted: #9db0c5; --line: #22385a; --line-2: #182b45;
  --primary: #5d8dff; --primary-ink: #04122a; --primary-soft: #16294a; --focus: #7fb0ff; --bright: #7fb0ff; --cyan-ink: #5fe6fb;
  --ok-bg: #0e3324; --ok-ink: #8fe3b6; --warn-bg: #3a2a0c; --warn-ink: #ffd28a; --err-bg: #3d1519; --err-ink: #ff7a80;
  --approval: #a98bff; --approval-soft: #221a45; --off-bg: #132439; --off-ink: #5f738c; --navy: #020c1a;
  --res: #4f7fd6; --res-soft: #15284a;
  --shadow: 0 12px 32px rgba(0,0,0,.55); --shadow-sm: 0 2px 8px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #07111f; --surface: #0d1b2f; --surface-2: #112339; --ink: #e7eef7; --muted: #9db0c5; --line: #22385a; --line-2: #182b45;
  --primary: #5d8dff; --primary-ink: #04122a; --primary-soft: #16294a; --focus: #7fb0ff; --bright: #7fb0ff; --cyan-ink: #5fe6fb;
  --ok-bg: #0e3324; --ok-ink: #8fe3b6; --warn-bg: #3a2a0c; --warn-ink: #ffd28a; --err-bg: #3d1519; --err-ink: #ff7a80;
  --approval: #a98bff; --approval-soft: #221a45; --off-bg: #132439; --off-ink: #5f738c; --navy: #020c1a;
  --res: #4f7fd6; --res-soft: #15284a;
  --shadow: 0 12px 32px rgba(0,0,0,.55); --shadow-sm: 0 2px 8px rgba(0,0,0,.4); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1320px; margin: 0 auto; padding-block: 24px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
/* Embebido en Configuracion (Semanas bloqueadas): sin margenes propios */
html.emb body { background: transparent; }
html.emb .wrap { max-width: none; padding: 0; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.head h1 { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.head p { color: var(--muted); font-size: 13px; max-width: 72ch; }
.scope { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }

.tabs { position: relative; display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { padding: 10px 14px; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-color: var(--cyan); }
.count { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); }
.count.ap { background: var(--approval-soft); color: var(--approval); }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--r-ctl); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn.primary { background: var(--primary); color: var(--primary-ink); }
.btn.ghost { border: 1px solid var(--line); background: var(--surface); }
.btn.ghost:hover:not(:disabled) { border-color: var(--bright); }
.btn.approve { background: var(--approval); color: #fff; }
.btn.danger { border: 1px solid var(--err-ink); color: var(--err-ink); background: var(--surface); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.link { color: var(--bright); font-weight: 500; font-size: 13px; }
.link:hover { text-decoration: underline; }
.icon-btn { width: 32px; height: 32px; border-radius: var(--r-ctl); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: var(--off-bg); color: var(--off-ink); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok-ink); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
.pill.err { background: var(--err-bg); color: var(--err-ink); }
.pill.pri { background: var(--primary-soft); color: var(--primary); }
.pill.ap { background: var(--approval-soft); color: var(--approval); }
.pill.prop { background: transparent; border: 1px dashed var(--approval); color: var(--approval); }
.pill.sim { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.pill .ic { width: 12px; height: 12px; }
.muted { color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); }

.banner { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; padding: 12px 16px; border-radius: var(--r-surf); border: 1px solid var(--line); background: var(--surface); }
.banner .txt { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.banner b { font-weight: 600; font-size: 13.5px; }
.banner span { font-size: 12.5px; color: var(--muted); }
.banner.warn { background: var(--warn-bg); border-color: transparent; }
.banner.warn b, .banner.warn span { color: var(--warn-ink); }
.banner.ap { background: var(--approval-soft); border-color: transparent; }
.banner.ap b, .banner.ap span { color: var(--approval); }
.banner.ok { background: var(--ok-bg); border-color: transparent; }
.banner.ok b, .banner.ok span { color: var(--ok-ink); }
.banner.err { background: var(--err-bg); border-color: transparent; }
.banner.err b, .banner.err span { color: var(--err-ink); }
.banner .b-ic { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.06); flex: none; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.card-h h2 { font-size: 15px; font-weight: 600; }
.card-h p { font-size: 12.5px; color: var(--muted); max-width: 80ch; }

/* Barra de herramientas */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .sp { flex: 1 1 auto; }
.sbox { position: relative; flex: 1 1 200px; max-width: 280px; }
.sbox .search { max-width: none; }
.sug { position: absolute; top: calc(100% + 4px); left: 0; min-width: 100%; width: max-content; max-width: min(380px, 90vw); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-ctl); box-shadow: 0 8px 20px rgba(0,28,63,.16); max-height: 300px; overflow: auto; z-index: 30; padding: 4px; }
.sug-h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 8px 2px; font-weight: 500; }
.sug-e { padding: 10px 8px; font-size: 13px; color: var(--muted); }
.sug button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; background: none; text-align: left; font-size: 13px; color: var(--ink); border-radius: 3px; cursor: pointer; }
.sug button:hover, .sug button:focus-visible { background: var(--primary-soft, var(--line-2)); }
.sug-c { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); padding: 0 10px; flex: 1 1 200px; max-width: 280px; color: var(--muted); }
.search input { border: 0; background: transparent; padding: 8px 0; min-width: 0; flex: 1; color: var(--ink); outline: none; }
select.f { border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); padding: 8px 10px; min-width: 0; max-width: 100%; color: var(--ink); }
.toolbar select.f { flex: 0 1 260px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-ctl); overflow: hidden; background: var(--surface); }
.seg button { padding: 7px 12px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); font-weight: 600; }

/* Carrusel de semanas */
.weeks { display: flex; gap: 8px; align-items: center; min-width: 0; }
.wlist { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; padding: 11px 2px 2px; }
.wlist::-webkit-scrollbar { display: none; }
.wk { flex: 1 0 104px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 7px 10px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface); text-align: left; position: relative; }
.wk b { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.wk small { font-size: 11px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.wk small .ic { width: 11px; height: 11px; }
.wk[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.wk[aria-pressed="true"] small { color: inherit; opacity: .85; }
.wk.cur::after { content: "Hoy"; position: absolute; top: -9px; z-index: 1; box-shadow: 0 0 0 2px var(--surface); right: 8px; font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 999px; background: var(--cyan); color: #02121f; }
.wk.fut { border-style: dashed; }

/* Resumen por semana */
.sumrow { display: grid; gap: 12px; }
.wsum { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.wsum-h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.wsum-h b { font-weight: 600; font-size: 14px; }
.wsum-h small { color: var(--muted); font-size: 12px; }
.wsum .kv { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); }
.wsum .kv b { color: var(--ink); font-weight: 600; }

/* Tablero */
.board { display: flex; flex-direction: column; gap: 14px; }
.prow { display: flex; flex-direction: column; gap: 8px; }
.prow-h { display: flex; gap: 10px; align-items: center; min-width: 0; }
.prow-h .nm { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.prow-h .nm b { font-weight: 600; font-size: 14px; }
.prow-h .nm small { font-size: 11.5px; color: var(--muted); }
.cols { display: grid; gap: 12px; align-items: start; }
.av { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex: none; background: var(--navy); display: inline-flex; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av .ini { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 12px; }
.av.sm { width: 24px; height: 24px; }
.av.sm .ini { font-size: 10px; }
.code { font-size: 11.5px; font-weight: 600; letter-spacing: .02em; color: var(--muted); white-space: nowrap; }

.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); display: flex; flex-direction: column; min-width: 0; animation: rise .28s ease both; }
.wcard.locked { background: var(--surface-2); }
/* La tarjeta con un menu abierto queda por encima de las demas (la animacion crea un contexto de apilamiento por tarjeta) */
.wcard { position: relative; }
.wcard:has(.menu) { z-index: 40; }
.wcard.fut { border-style: dashed; }
.wc-h { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; padding: 12px 12px 8px 14px; min-width: 0; }
.wc-meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 0 14px 8px; }
.wc-meta .xs-st, .wc-meta .pill { font-size: 11px; padding: 1px 8px; }
.wc-h .wt { font-size: 13.5px; font-weight: 600; }
.wc-h .wn { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.ast { font-size: 11px; color: var(--muted); white-space: nowrap; }
.ln-h .code { font-size: 11px; letter-spacing: 0; }
.ln-h .ln-v { gap: 6px; font-size: 11.5px; }
.ln-h .ln-v .ic.chev { width: 14px; height: 14px; }
/* Agregar (proyecto en la semana, fase en el editor): + en circulo */
.addc { width: 24px; height: 24px; border-radius: 50%; border: 1px dashed var(--off-ink); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.addc:hover, .addc[aria-expanded="true"] { border-style: solid; border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.addc .ic { width: 13px; height: 13px; }
.addc.sm { width: 26px; height: 26px; }
.wc-h .sp { flex: 1 1 auto; }
.load { padding: 0 14px 10px; display: flex; flex-direction: column; gap: 5px; }
.load-t { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; }
.load-t b { font-weight: 600; }
.bar { position: relative; height: 8px; border-radius: 999px; background: var(--line-2); overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--off-ink); transition: width .35s ease; }
.bar i.full { background: var(--ok-ink); }
.bar i.over { background: var(--err-ink); }
.bar i.res { background: var(--res); }
.load-t > span:first-child { display: inline-flex; gap: 5px; align-items: center; }
.load-t .ic { width: 14px; height: 14px; }
.st-res { color: var(--muted); }
.st-under { color: var(--muted); }
.st-full { color: var(--ok-ink); }
.st-over { color: var(--err-ink); }

.lines { display: flex; flex-direction: column; border-top: 1px solid var(--line-2); }
.ln { border-bottom: 1px solid var(--line-2); }
.ln:last-child { border-bottom: 0; }
.ln-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 9px 4px 9px 14px; width: 100%; text-align: left; }
/* Linea en dos renglones: codigo y valores arriba, nombre completo abajo (hasta 2 lineas) */
.ln-h .ln-n { display: contents; }
.ln-h .ln-n > :first-child { grid-column: 1; grid-row: 1; }
.ln-h .ln-n > :last-child { grid-column: 1 / -1; grid-row: 2; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12.5px; line-height: 1.35; }
.ln-h .ln-n > :only-child { grid-column: 1; grid-row: 1; white-space: nowrap; display: flex; -webkit-line-clamp: none; }
.ln-h .ln-v { grid-column: 2; grid-row: 1; }
.ln-h:hover { background: var(--surface-2); }
.ln-row { display: flex; align-items: center; }
.ln-row .ln-h { flex: 1 1 auto; min-width: 0; }
.ln-x { width: 28px; height: 28px; margin-right: 6px; align-self: flex-start; margin-top: 6px; border-radius: var(--r-ctl); display: inline-flex; align-items: center; justify-content: center; color: var(--off-ink); flex: none; }
.ln-x:hover { background: var(--err-bg); color: var(--err-ink); }
.ln-x .ic { width: 14px; height: 14px; }
.ln-n { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.ln-n span { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ln-v { display: flex; gap: 8px; align-items: center; font-size: 12px; white-space: nowrap; }
.ln-v .r { color: var(--muted); }
.ln-v .e { font-weight: 600; }
.ln-v .ic.chev { transition: transform .2s; color: var(--muted); }
.ln.open .ln-v .ic.chev { transform: rotate(180deg); }
.ln-acts { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.tag { font-size: 10.5px; font-weight: 600; padding: 0 6px; border-radius: 999px; }
.tag.abs { background: var(--navy); color: #fff; }
.tag.noplan { background: var(--warn-bg); color: var(--warn-ink); }
.tag.closed { background: var(--off-bg); color: var(--off-ink); }
.ph-list { display: flex; flex-direction: column; gap: 4px; padding: 0 14px 12px; }
.ph-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); }
.ph-row b { color: var(--ink); font-weight: 500; }

/* Editor */
.editor { margin: 0 10px 12px; padding: 12px; border-radius: var(--r-ctl); background: var(--surface-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.ed-row { display: grid; grid-template-columns: minmax(0, 1fr) 88px 32px 26px; gap: 8px; align-items: center; font-size: 13px; }
.ph-sel, .nf-mot { border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); padding: 6px 8px; font-size: 13px; color: var(--ink); min-width: 0; width: 100%; }
.nf-mot { grid-column: 1 / -1; }
.ed-row.nf .ph-sel { border-color: var(--approval); }
.ph-lock { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); min-width: 0; }
.ph-lock .ic { width: 13px; height: 13px; }
.ed-add { display: inline-flex; gap: 6px; align-items: center; align-self: flex-start; }
.ferr.muted { color: var(--muted); }
.ed-row label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hin { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); padding-right: 8px; }
.hin input { width: 100%; min-width: 0; border: 0; background: transparent; padding: 6px 8px; text-align: right; outline: none; }
.hin span { color: var(--muted); font-size: 12px; }
.ed-row.bad .hin { border-color: var(--err-ink); }
.ferr { grid-column: 1 / -1; font-size: 12px; color: var(--err-ink); }
.ed-sum { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.ed-sum b { color: var(--ink); }
.ed-acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.form-err { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--err-ink); background: var(--err-bg); padding: 8px 10px; border-radius: var(--r-ctl); }

.wc-f { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 14px 12px; border-top: 1px solid var(--line-2); }
.wc-f .sp { flex: 1 1 auto; }
.wc-f select { border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); padding: 5px 8px; font-size: 12.5px; max-width: 100%; min-width: 0; }
.wc-note { padding: 10px 14px 12px; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; border-top: 1px solid var(--line-2); }
.kw { position: relative; }
