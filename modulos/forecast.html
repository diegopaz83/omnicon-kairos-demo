<style>
/* Layout: pestanas de Analitica, cabecera con cluster, subpestanas del modulo y contenido a lo ancho.
   Tokens del Ecosistema (design/planeacion-v1), copiados de Configuracion. */
:root {
  color-scheme: light;
  --font: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --navy: #001c3f; --bright: #0a58eb; --cyan: #00dcfa; --cyan-ink: #007f93;
  --bg: #f2f5f9; --surface: #fff; --surface-2: #f6f8fb; --ink: #001c3f; --muted: #556578; --line: #dbe2ea; --line-2: #eef2f6;
  --primary: #002473; --primary-ink: #fff; --primary-soft: #e8eefc; --focus: #0a58eb;
  --ok-bg: #e5f7ee; --ok-ink: #145a37; --warn-bg: #fff4e0; --warn-ink: #7a4a00; --err-bg: #fbeaeb; --err-ink: #b0353c;
  --approval: #7543ff; --approval-soft: #f1ecff; --off-bg: #e9edf2; --off-ink: #8593a5;
  --admin: #001c3f; --admin-ink: #fff;
  --shadow: 0 12px 32px rgba(0,28,63,.18); --shadow-sm: 0 2px 8px rgba(0,28,63,.08);
  --r-ctl: 8px; --r-surf: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #07111f; --surface: #0d1b2f; --surface-2: #112339; --ink: #e7eef7; --muted: #9db0c5; --line: #22385a; --line-2: #182b45;
  --primary: #5d8dff; --primary-ink: #04122a; --primary-soft: #16294a; --focus: #7fb0ff; --bright: #7fb0ff; --cyan-ink: #5fe6fb;
  --ok-bg: #0e3324; --ok-ink: #8fe3b6; --warn-bg: #3a2a0c; --warn-ink: #ffd28a; --err-bg: #3d1519; --err-ink: #ff7a80;
  --approval: #a98bff; --approval-soft: #221a45; --off-bg: #132439; --off-ink: #5f738c; --navy: #020c1a;
  --admin: #00dcfa; --admin-ink: #02121f;
  --shadow: 0 12px 32px rgba(0,0,0,.55); --shadow-sm: 0 2px 8px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #07111f; --surface: #0d1b2f; --surface-2: #112339; --ink: #e7eef7; --muted: #9db0c5; --line: #22385a; --line-2: #182b45;
  --primary: #5d8dff; --primary-ink: #04122a; --primary-soft: #16294a; --focus: #7fb0ff; --bright: #7fb0ff; --cyan-ink: #5fe6fb;
  --ok-bg: #0e3324; --ok-ink: #8fe3b6; --warn-bg: #3a2a0c; --warn-ink: #ffd28a; --err-bg: #3d1519; --err-ink: #ff7a80;
  --approval: #a98bff; --approval-soft: #221a45; --off-bg: #132439; --off-ink: #5f738c; --navy: #020c1a;
  --admin: #00dcfa; --admin-ink: #02121f;
  --shadow: 0 12px 32px rgba(0,0,0,.55); --shadow-sm: 0 2px 8px rgba(0,0,0,.4); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1180px; margin: 0 auto; padding-block: 24px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.head h1 { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.head p { color: var(--muted); font-size: 13px; max-width: 70ch; }
.me-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { padding: 10px 14px; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-color: var(--cyan); }
.count { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--r-ctl); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn.primary { background: var(--primary); color: var(--primary-ink); }
.btn.ghost { border: 1px solid var(--line); background: var(--surface); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: var(--off-bg); color: var(--off-ink); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok-ink); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); }

.pill.adm { background: var(--admin); color: var(--admin-ink); }
.pill.prop { background: transparent; border: 1px dashed var(--approval); color: var(--approval); }
.pill.sim { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); }

.banner { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; border-radius: var(--r-surf); border: 1px solid var(--line); background: var(--surface); }
.banner .txt { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.banner b { font-weight: 600; font-size: 13.5px; }
.banner span { font-size: 12.5px; color: var(--muted); }
.banner.warn { background: var(--warn-bg); border-color: transparent; }
.banner.warn b, .banner.warn span { color: var(--warn-ink); }
.banner .b-ic { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: var(--primary-soft); color: var(--primary); flex: none; }
.banner.warn .b-ic { background: rgba(122,74,0,.12); color: var(--warn-ink); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.card-h h2 { font-size: 15px; font-weight: 600; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); padding: 0 10px; flex: 1 1 220px; max-width: 320px; color: var(--muted); }
.search input { border: 0; background: transparent; padding: 8px 0; min-width: 0; flex: 1; color: var(--ink); outline: none; }
.chip { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.chip .n { opacity: .7; }
select.f, input.f { border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); padding: 8px 10px; min-width: 0; color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-ctl); overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { padding: 7px 14px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); font-weight: 600; }

/* Forecast y Backlog: grilla, movimientos, cierre, cumplimiento, resumen, reuniones y alertas */
.wrap { max-width: none; }
.atabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.atabs button { padding: 10px 14px; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.atabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-color: var(--cyan); }
.sub { display: flex; gap: 6px; flex-wrap: wrap; }
.sub button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; }
.sub button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.sim { font-size: 11.5px; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi small { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.kpi b { font-size: 20px; font-weight: 600; }
.kpi span { font-size: 12px; color: var(--muted); }
.st { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; display: inline-block; }
.st.COMPLETE { background: var(--ok-bg); color: var(--ok-ink); } .st.MISSING { background: var(--warn-bg); color: var(--warn-ink); } .st.OVER { background: var(--err-bg); color: var(--err-ink); }
.gwrap { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: var(--r-surf); background: var(--surface); }
table.g { border-collapse: separate; border-spacing: 0; font-size: 12.5px; width: max-content; min-width: 100%; }
table.g th, table.g td { padding: 6px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; background: var(--surface); }
table.g thead th { position: sticky; top: 0; z-index: 2; background: var(--surface-2); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
table.g thead tr:nth-child(2) th { top: 29px; }
table.g .stk { position: sticky; left: 0; z-index: 1; min-width: 240px; max-width: 280px; white-space: normal; border-right: 1px solid var(--line); }
table.g thead .stk { z-index: 3; }
table.g td.n, table.g th.n { text-align: right; }
table.g .grp { border-left: 1px solid var(--line); }
table.g tr.tot td { font-weight: 600; background: var(--surface-2); }
.cell { width: 110px; text-align: right; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; background: transparent; font-variant-numeric: tabular-nums; }
.cell:hover:not([readonly]) { border-color: var(--line); }
.cell:focus { border-color: var(--bright); outline: none; background: var(--surface); }
.cell[readonly] { color: var(--muted); }
.cell.chg { background: var(--warn-bg); color: var(--warn-ink); font-weight: 600; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.adj { color: var(--approval); font-weight: 600; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.cap { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 899px) { .cap { grid-template-columns: 1fr; } }
.modal-bg { position: fixed; inset: 0; background: rgba(0,28,63,.32); z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: var(--r-surf); box-shadow: var(--shadow); width: min(760px, 100%); display: flex; flex-direction: column; }
.modal-h { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.modal-h h2 { font-size: 16px; font-weight: 600; }
.modal-b { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.modal-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.err { font-size: 12.5px; color: var(--err-ink); background: var(--err-bg); border-radius: var(--r-ctl); padding: 8px 10px; }
.lb { display: block; border: 0; background: none; padding: 0; font: inherit; color: var(--ink); cursor: pointer; text-align: left; }
.lb:hover { color: var(--bright); }
.al { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.al:last-child { border-bottom: 0; }
.blk { border: 1px solid var(--line); border-radius: var(--r-surf); padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.blk h3 { font-size: 14px; font-weight: 600; }
.blk h4 { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 0; text-transform: uppercase; letter-spacing: .04em; }
textarea.f { border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); padding: 8px 10px; color: var(--ink); min-height: 64px; resize: vertical; }
.steps { display: flex; gap: 8px; flex-wrap: wrap; }
.steps span { font-size: 12.5px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.steps span.on { border-color: var(--primary); color: var(--primary); font-weight: 600; }
.steps span.ok { background: var(--ok-bg); color: var(--ok-ink); border-color: transparent; }
/* Tableros: paleta validada (sube azul, baja naranja, totales gris neutro) */
:root { --dv-up: #1f4fbf; --dv-down: #c8620e; --dv-neu: #5b6b80; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --dv-up: #5a8af5; --dv-down: #c96f22; --dv-neu: #8090a6; } }
:root[data-theme="dark"] { --dv-up: #5a8af5; --dv-down: #c96f22; --dv-neu: #8090a6; }
.tb { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.tb > .card { gap: 10px; }
.chw { overflow: hidden; }
svg.ch { display: block; overflow: visible; }
svg.ch text { font-family: var(--font); }
.ch .gl { stroke: var(--line-2); stroke-width: 1; }
.ch .base { stroke: var(--line); stroke-width: 1; }
.ch .ax { font-size: 10.5px; fill: var(--muted); }
.ch .lbl { font-size: 12px; fill: var(--ink); }
.ch .vl { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; dominant-baseline: middle; }
.ch text.vl[text-anchor] { dominant-baseline: auto; }
.ch .lbl { dominant-baseline: middle; }
.ch .b { font-weight: 600; fill: var(--ink); }
.ch .dv-up { fill: var(--dv-up); } .ch .dv-down { fill: var(--dv-down); } .ch .dv-neu { fill: var(--dv-neu); }
.ch .dv-up.live { fill-opacity: .55; }
.ch .hx-bg { fill: var(--surface); }
.ch .cm { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.ch .brk { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.ch .cn { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 2; }
.ch .hit { fill: transparent; cursor: default; }
.ch .hit:hover { fill: var(--ink); fill-opacity: .04; }
.lg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.lg span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw.dv-up { background: var(--dv-up); } .sw.dv-down { background: var(--dv-down); } .sw.dv-neu { background: var(--dv-neu); }
.sw.ln { height: 2px; border-radius: 1px; background: var(--ink); }
.sw.hxs { background: repeating-linear-gradient(45deg, var(--dv-down) 0 2.5px, var(--surface) 2.5px 5px); outline: 1px solid var(--dv-down); outline-offset: -1px; }
.tv summary { cursor: pointer; font-size: 12.5px; color: var(--bright); }
.tv[open] summary { margin-bottom: 8px; }
table.am td:first-child { white-space: normal; min-width: 150px; }
table.am th, table.am td:not(:first-child) { white-space: nowrap; }
.tip { position: fixed; z-index: 70; background: var(--navy); color: #fff; font-size: 12px; line-height: 1.45; padding: 8px 10px; border-radius: var(--r-ctl); box-shadow: var(--shadow); white-space: pre-line; pointer-events: none; max-width: 280px; font-variant-numeric: tabular-nums; }
button.lnk { color: var(--bright); text-decoration: underline; font-size: inherit; }
/* Grilla rediseñada [boceto 9 y 10]: carrusel de meses, filtros agrupados, bloques por moneda */
.kweeks { display: flex; gap: 8px; align-items: center; min-width: 0; }
.btn.icon { border: 1px solid var(--line); background: var(--surface); padding: 0; width: 38px; height: 46px; justify-content: center; flex: none; }
.btn.icon:hover:not(:disabled) { border-color: var(--primary); }
.btn.hoy { color: var(--primary); }
.btn.hoy:disabled { color: var(--off-ink); background: var(--surface-2); }
.btn.hoy .ic { width: 18px; height: 18px; }
.kwlist { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; padding: 11px 2px 2px; }
.kwlist::-webkit-scrollbar { display: none; }
.kwk { flex: 1 0 104px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 7px 10px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-align: left; position: relative; }
.kwk:hover { border-color: var(--primary); }
.kwk b { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.kwk small { font-size: 11px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.kwk small .ic { width: 11px; height: 11px; }
.kwk.past { background: var(--surface-2); } .kwk.past b { color: var(--muted); font-weight: 500; }
.kwk[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.kwk[aria-pressed="true"] small, .kwk[aria-pressed="true"] b { color: inherit; } .kwk[aria-pressed="true"] small { opacity: .85; }
.kwk.past[aria-pressed="true"] { background: var(--dv-neu); border-color: var(--dv-neu); color: #fff; }
.kwk.cur::after { content: "Hoy"; position: absolute; top: -9px; right: 8px; z-index: 1; font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 999px; background: var(--cyan); color: #02121f; box-shadow: 0 0 0 2px var(--bg); }
.fbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 10px 12px; display: grid; gap: 8px; }
.frow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ms { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface-2); padding: 0 6px 0 9px; min-height: 38px; flex: 1 1 118px; min-width: 132px; max-width: 220px; color: var(--muted); }
.ms.q { flex: 1.4 1 170px; max-width: 320px; min-width: 170px; }
.ms:focus-within { border-color: var(--focus); box-shadow: 0 0 0 2px var(--primary-soft); }
.ms .lbl { font-size: 11px; color: var(--muted); font-weight: 500; flex: none; }
.ms select, .ms input { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; padding: 7px 0; color: var(--ink); font-size: 13px; }
.ms select { cursor: pointer; }
.tseg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-ctl); overflow: hidden; background: var(--surface); flex: none; }
.tseg button { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; height: 38px; font-size: 13px; border-left: 1px solid var(--line-2); }
.tseg button:first-child { border-left: 0; }
.tseg button[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.btn.clear { padding: 8px 8px; font-weight: 600; letter-spacing: .03em; color: var(--primary); font-size: 12.5px; }
.fbox .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 28px; }

    var txt = 'En ' + F.mLabel(m) + ' se facturó ' + money(s.inv, cur) + ' de ' + money(s.com, cur) + ' comprometidos' + (pv != null ? ' (' + pv + ' %)' : '') + '.' + (keys.length ? ' La diferencia se explica sobre todo por: ' + keys.join('; ') + '.' : '') + (s.open ? ' Quedan ' + money(s.open, cur) + ' sin explicar.' : '');
    var A1 = { action: 'Explicar la variación del mes', origin: 'Tableros', intro: 'Tomé la cascada de ' + F.mLabel(m) + ' y leí las razones de los movimientos:',
      card: { title: 'Variación de ' + F.mLabel(m), findings: Fd, foot: 'Las cifras son de Odoo · simulado; omnIA solo explica', buttons: [{ label: 'Descartar', act: 'dismiss' }, { label: 'Copiar explicación', act: 'copy', primary: true }] },
      onAction: function (act) {
        if (act === 'copy') { copyTxt(txt); return 'Explicación copiada'; }
        if (act === 'go:grid') { ui.tab = 'grilla'; render(); window.scrollTo(0, 0); }
        return null;
      } };
    if (ret) return A1; o.assist(A1);
  }
  function question(n, c) {
    if (/incompleta/.test(n)) return '¿Cuándo completas la proyección de ' + c + '?';
    if (/proyectado de m/.test(n)) return '¿Cuánto esperas facturar de verdad en ' + c + '? Está proyectado por encima de lo vendido.';
    if (/de menos/.test(n)) return '¿Lo que no se facturó en ' + c + ' se aplaza o se elimina?';
    if (/de m[aá]s en el cierre/.test(n)) return '¿Por qué ' + c + ' facturó más de lo comprometido?';
    if (/mas de lo vendido|más de lo vendido/.test(n)) return '¿Qué se facturó en ' + c + ' por encima de lo vendido? ¿Hay un adicional sin cotizar?';
    if (/vencid/.test(n)) return '¿Qué pasó con lo proyectado de ' + c + ' en meses anteriores?';
    return '¿Qué pasa con ' + c + ' (' + n + ')?';
  }
  function aiMeet(L, ret) {
    var o = OMN(); if (!o || !L) return;
    var A = F.base().acc, codes = Object.keys(A).filter(function (c) { return A[c].cluster === ui.cl && A[c].leader === L && F.seesAccount(c, ME); });
    var al = F.alerts(ui.cl).filter(function (a) { return codes.indexOf(a.code) >= 0; }), Fd = [], Qs = [], withN = [];
    var kinds = {}; al.forEach(function (a) { kinds[a.kind] = (kinds[a.kind] || 0) + 1; });
    Fd.push({ k: al.length ? 'n' : 'k', src: 'rg', html: '<b>' + codes.length + ' CECO · ' + al.length + (al.length === 1 ? ' alerta viva' : ' alertas vivas') + '.</b> ' + esc(Object.keys(kinds).map(function (k) { return k + ' ' + kinds[k]; }).join(' · ')) });
    codes.forEach(function (c) { var v = novOf(c); if (!v.nov.length) return; withN.push(c); v.nov.forEach(function (n) { Qs.push(question(n, c)); }); if (withN.length <= 4) Fd.push({ k: 'w', src: 'rg', html: '<b>' + esc(c) + ' · ' + esc(A[c].name) + '.</b> ' + esc(v.nov.join(', ')) + '.' }); });
    var said = 0; withN.forEach(function (c) { var b = F.bitacorasOf(c)[0]; if (!b || said >= 2) return; said++; Fd.push({ k: 'n', src: 'ia', html: '<b>Lo último escrito de ' + esc(c) + '.</b> «' + esc(cut1(b.text, 120)) + '» · ' + esc(b.date) + '. ¿Sigue vigente?' }); });
    if (!Qs.length) Qs.push('¿Hay algo que vaya a moverse este mes que la grilla no muestre?');
    Qs = Qs.filter(function (q, i) { return Qs.indexOf(q) === i; }).slice(0, 5);
    Fd.push({ k: 'k', src: 'ia', html: '<b>Preguntas para el líder</b><br>' + Qs.map(function (q) { return '· ' + esc(q); }).join('<br>') });
    var A1 = { action: 'Preparar la conversación con @' + L, origin: 'Cierre mensual', intro: 'Junté las novedades, las alertas y la última bitácora de los CECO de ' + L + ':',
      card: { title: 'Conversación con @' + L, findings: Fd, foot: 'omnIA prepara; la conversación la tiene el analista', buttons: [{ label: 'Descartar', act: 'dismiss' }, { label: 'Copiar preguntas', act: 'copy', primary: true }] },
      onAction: function (act) { if (act === 'copy') { copyTxt(Qs.join('\n')); return 'Preguntas copiadas'; } return null; } };
    if (ret) return A1; o.assist(A1);
  }
  function aiMeetBtn(L) { return omOk() ? '<button class="btn aib sm" data-ai="meet" data-v="' + esc(L) + '"><span class="aiorb"></span>Preparar conversación</button>' : ''; }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-ai]'); if (!t) return;
    if (t.dataset.ai === 'var') aiVar(); else if (t.dataset.ai === 'meet') aiMeet(t.dataset.v);
  });
  var omLastF = '';
  function topLeader() { var A = F.base().acc, n = {}; Object.keys(A).forEach(function (c) { if (A[c].cluster === ui.cl && F.seesAccount(c, ME) && novOf(c).nov.length) n[A[c].leader] = (n[A[c].leader] || 0) + 1; }); return Object.keys(n).sort(function (a, b) { return n[b] - n[a]; })[0]; }
  function omSyncF() {
    omWhenReady(); var o = OMN(); if (!o || !o.setRecord || EMB) return; var k = ui.cl; if (k === omLastF) return; omLastF = k;
    var tl = topLeader();
    try { o.setRecord('forecast', { id: ui.cl + ' ' + F.CUR, label: 'Forecast ' + (ui.cl === 'NA' ? 'North America' : 'LATAM') + ' · ' + F.mLabel(F.CUR), short: ui.cl }); } catch (e) { }
    try { if (o.onAsk) o.onAsk('forecast', function (low) {
      if (/reuni|prepar|lider|convers/.test(low)) { var A = F.base().acc, Ls = []; Object.keys(A).forEach(function (c) { if (A[c].cluster === ui.cl && Ls.indexOf(A[c].leader) < 0) Ls.push(A[c].leader); }); var L = Ls.filter(function (x) { return low.indexOf(nrm(x).split(' ')[0]) >= 0; })[0] || topLeader(); return L ? aiMeet(L, true) : null; }
      if (/variac|explic|cumpl|factur|cascada/.test(low)) return aiVar(true);
      return null;
    }, ['Explica la variación del último mes cerrado'].concat(tl ? ['Prepara la conversación con ' + tl] : [])); } catch (e) { }
  }
  var _rndAI = render; render = function () { var r = _rndAI.apply(this, arguments); omSyncF(); return r; };

  render();
})();
