/* Lista con el estandar de Forecast [ACORDADO 04-nov, boceto 38-39] */
.head.lh { align-items: flex-end; margin-bottom: 16px; }
.head .lead { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 70ch; }
.head .hr { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg.cl button.on, .seg.mine button.on { background: var(--primary-soft); color: var(--primary); box-shadow: none; font-weight: 600; }
.seg.mine button b { font-size: 10.5px; font-weight: 600; background: var(--primary); color: #fff; border-radius: 999px; padding: 0 6px; margin-left: 6px; }
.scope { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; color: var(--primary); background: var(--primary-soft); border-radius: 999px; padding: 4px 10px 4px 8px; white-space: nowrap; }
.scope .ic { width: 13px; height: 13px; }
.kp4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.kp4 .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kp4 .kpi small { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.kp4 .kr { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.kp4 .kr b { font-size: 22px; font-weight: 600; white-space: nowrap; } .kp4 .kr em { font-style: normal; font-size: 12px; color: var(--muted); }
.kp4 .kpi > span { font-size: 12px; color: var(--muted); }
.kp4 .kpi.ap .kr b { color: var(--violet); } .kp4 .kpi.w .kr b { color: var(--warn-ink); } .kp4 .kpi.g .kr b { color: var(--ok-ink); }
.kbar { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--err) 30%, var(--surface)); overflow: hidden; margin: 4px 0 2px; } .kbar i { display: block; height: 100%; background: #1f8f5a; }
.funnel { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r-surf); overflow: hidden; background: var(--surface); margin-bottom: 12px; }
.funnel button { border: 0; border-left: 1px solid var(--line-2); background: none; padding: 10px 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.funnel button:first-child { border-left: 0; }
.funnel button:hover { background: var(--surface-2); }
.funnel button.on { background: var(--primary-soft); box-shadow: inset 0 -3px 0 var(--primary); }
.funnel small { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.funnel small i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.funnel b { font-size: 18px; font-weight: 600; line-height: 1.2; } .funnel span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fbx { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.fbx .fr { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fbx .search { flex: 1.4 1 200px; max-width: none; background: var(--surface-2); }
.ms { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface-2); padding: 0 8px 0 10px; min-height: 38px; flex: 1 1 118px; min-width: 0; }
.ms .lbl { font-size: 11px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.ms select { border: 0; background: none; font-size: 13px; color: var(--ink); flex: 1; min-width: 0; padding: 6px 0; outline: none; }
.fbx .seg { flex: none; }
.clr { width: 40px; height: 38px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; position: relative; flex: none; }
.clr i { position: absolute; top: -6px; right: -6px; background: var(--primary); color: var(--primary-ink); font-size: 10px; font-style: normal; font-weight: 600; border-radius: 999px; min-width: 16px; line-height: 16px; text-align: center; }
.fbx .ctx { font-size: 12px; color: var(--muted); } .fbx .ctx b { color: var(--ink); }
table.list.ql { min-width: 0; }
.ql tr.grp td { background: var(--surface-2); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 7px 12px; border-top: 1px solid var(--line); }
.ql tr.grp td span { font-weight: 500; text-transform: none; letter-spacing: 0; margin-left: 8px; }
.ql tr.act td { background: color-mix(in srgb, var(--violet-soft) 60%, var(--surface)); }
.qc { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.qc > div { min-width: 0; }
.qi { width: 30px; height: 30px; border-radius: 8px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; flex: none; }
.ql td:first-child { width: 30%; min-width: 240px; max-width: 360px; }
.qc b { display: block; font-weight: 600; font-size: 13px; }
.ql .qc b, .ql .qc > div > small:not(.cid) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qc small { display: block; font-size: 12px; color: var(--muted); }
.qc .cid { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--ink); }
.rv { font-size: 10.5px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.un-m { display: none; }
.tag.un.SM { background: var(--violet-soft); color: var(--violet-ink); } .tag.un.AU { background: var(--primary-soft); color: var(--primary); } .tag.un.CO { background: var(--cyan-soft); color: #00727f; }
.ql .tag { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; }
.mdx { display: flex; flex-wrap: wrap; gap: 4px; } .mdx span { font-size: 11.5px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; white-space: nowrap; color: var(--ink); }
.ql .val b { display: block; font-weight: 600; } .ql .val small { display: block; font-size: 11.5px; color: var(--muted); }
.st2 { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; color: var(--c); background: color-mix(in srgb, var(--c) 13%, var(--surface)); }
.st2 i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.nx { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; } .nx.w { color: var(--warn-ink); } .nx.ok { color: var(--ok-ink); } .nx.ap { color: var(--violet); }
.revb { display: inline-flex; margin-top: 6px; font-size: 12px; font-weight: 600; color: #fff; background: var(--violet); border-radius: 8px; padding: 4px 12px; }
.whoq { display: flex; gap: 8px; align-items: center; font-size: 12.5px; white-space: nowrap; }
.qav { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; flex: none; background: var(--navy); display: inline-flex; }
.qav img { width: 100%; height: 100%; object-fit: cover; } .qav .ini { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-weight: 600; }
.cgrp { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; margin: 8px 0 0; } .cgrp span { margin-left: 6px; font-weight: 500; }
.qcard .l1 { align-items: flex-start; } .qcard .l3 b { color: var(--ink); }
@media (max-width: 1349px) { .ql .c-up, .ql .c-un { display: none; } .un-m { display: inline; } }
@media (max-width: 1149px) { .ql .c-un, .ql .c-mod, .ql .c-up { display: none; } .un-m { display: inline; } .kp4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .funnel { grid-template-columns: repeat(3, minmax(0, 1fr)); } .funnel button:nth-child(3n+1) { border-left: 0; } .funnel button:nth-child(n+4) { border-top: 1px solid var(--line-2); } .ms { flex-basis: 150px; } }
@media (max-width: 899px) { .funnel { grid-template-columns: repeat(2, minmax(0, 1fr)); } .funnel button:nth-child(3n+1) { border-left: 1px solid var(--line-2); } .funnel button:nth-child(odd) { border-left: 0; } .funnel button:nth-child(n+3) { border-top: 1px solid var(--line-2); } .tblw { display: none; } .cards { display: grid; } .head .hr { width: 100%; } .head .hr .seg.cl { flex: 1; } .head .hr .seg.cl button { flex: 1; } .ms { flex-basis: calc(50% - 8px); } .fbx .search { flex-basis: 100%; } .funnel span { display: none; } }
.ai-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; }
</style>

html, body { margin: 0; }
html, body { overflow-x: clip; }
:root { --cyan-soft: #ccfbfe; --violet-soft: #ece6ff; --violet-ink: #3530a5; --row-ph: #f4f7fb; --gw-act: 270px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cyan-soft: #0c3a44; --violet-soft: #241d4a; --violet-ink: #c4b5ff; --row-ph: #0f2036; } }
:root[data-theme="dark"] { --cyan-soft: #0c3a44; --violet-soft: #241d4a; --violet-ink: #c4b5ff; --row-ph: #0f2036; }

body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 13px; line-height: 1.45; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.top { background: var(--navy); color: #d8e6f7; display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
.top img { height: 22px; }
.top .crumb { font-size: 12px; opacity: .9; }
.top .crumb b { color: #fff; font-weight: 500; }
.top .crumb a { color: inherit; text-decoration: none; cursor: pointer; }
.top .crumb a:hover { text-decoration: underline; }
.top .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.top select { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 3px 10px; font-size: 11px; }
.top select option { color: #001c3f; }
.top .demo { font-size: 11px; background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }

.page { padding-block: 18px 96px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; margin-bottom: 14px; }
.head h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.spacer { flex: 1; }
.muted { color: var(--muted); }

.btn { min-height: 36px; padding: 6px 12px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--primary); }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.soft { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.btn.ghost { background: none; border-color: transparent; }
.btn.danger { color: var(--err); }
.btn.sm { min-height: 30px; padding: 4px 9px; font-size: 11.5px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 500; color: var(--muted); min-height: 30px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,28,63,.15); }
.seg button .n { font-size: 10.5px; color: var(--muted); margin-left: 4px; }

/* Chips de estado */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st.borrador { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.st.revision { background: var(--warn-bg); color: var(--warn-ink); }
.st.aprobada { background: var(--cyan-soft); color: var(--blue); }
.st.presentada { background: var(--primary-soft); color: var(--primary); }
.st.ganada { background: var(--ok-bg); color: var(--ok-ink); }
.st.no_ganada, .st.cancelada { background: var(--surface-2); color: var(--muted); border: 1px dashed var(--line); }
.st.pend { background: var(--warn-bg); color: var(--warn-ink); }
.st.fail { background: var(--err-bg); color: var(--err); }
.tag { font-size: 10px; border-radius: 4px; padding: 1px 6px; background: var(--blk); color: var(--muted); font-weight: 500; white-space: nowrap; }
.tag.un { background: var(--violet-soft); color: var(--violet-ink); }

/* Lista */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 10px 14px; text-align: left; display: grid; gap: 2px; }
.sum.on { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.sum b { font-size: 20px; font-weight: 600; }
.sum span { font-size: 11.5px; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.search { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); padding: 0 10px; min-height: 38px; flex: 1 1 260px; max-width: 380px; }
.search input { border: 0; background: none; outline: none; flex: 1; min-width: 0; padding: 8px 0; }
.search:focus-within { border-color: var(--focus); }
select.f { border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); min-height: 38px; padding: 0 10px; font-size: 12px; }
.tblw { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; min-width: 880px; }
.list th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.list td { padding: 10px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.list tr.row { cursor: pointer; }
.list tr.row:hover td { background: var(--surface-2); }
.list tr:last-child td { border-bottom: 0; }
.list .num { text-align: right; white-space: nowrap; }
.list .id b { font-weight: 600; display: block; }
.list .id small, .list .nm small { color: var(--muted); font-size: 11px; display: block; }
.list .nm b { font-weight: 500; display: block; }
.cards { display: none; gap: 10px; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 12px 14px; display: grid; gap: 6px; text-align: left; width: 100%; }
.qcard .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.qcard .l3 { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
.empty { padding: 32px; text-align: center; color: var(--muted); }

/* Detalle */
.qhead { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 14px 16px; display: grid; gap: 8px; margin-bottom: 12px; }
.qhead .t { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.qhead h1 { font-size: 19px; font-weight: 600; margin: 0; }
.qhead .meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12px; }
.qhead .meta b { color: var(--ink); font-weight: 500; }
.qid { font-weight: 600; font-size: 13px; background: var(--navy); color: #fff; border-radius: 6px; padding: 2px 8px; }
.qid.none { background: var(--warn-bg); color: var(--warn-ink); }

.stepper { display: flex; gap: 0; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); margin-bottom: 12px; scrollbar-width: thin; }
.step { flex: 1 0 128px; border: 0; background: none; text-align: left; padding: 10px 12px; display: grid; gap: 3px; border-right: 1px solid var(--line-2); position: relative; min-height: 64px; }
.step:last-child { border-right: 0; }
.step .n { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; }
.step .dot { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); flex: none; }
.step .s { font-size: 10.5px; color: var(--muted); }
.step.listo .dot { background: var(--cyan); border-color: var(--cyan); color: var(--navy); }
.step.revisar .dot { background: var(--violet); border-color: var(--violet); color: #fff; }
.step.revisar .s { color: var(--violet-ink); }
.step.on { background: var(--primary-soft); }
.step.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--bright); }
.step.lock { opacity: .55; }
.step .soon { font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

.coach { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--bright); border-radius: var(--r-ctl); padding: 9px 12px; margin-bottom: 12px; font-size: 12.5px; }
.coach.ok { border-left-color: var(--cyan); }
.coach.warn { border-left-color: var(--violet); }
.coach b { font-weight: 600; }
.coach ul { margin: 4px 0 0; padding-left: 18px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 16px; }
.panel h2 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
.panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; margin: 16px 0 8px; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.form .full { grid-column: 1 / -1; }
.fld { display: grid; gap: 4px; min-width: 0; }
.fld label, .fld .lb { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.fld input[type=text], .fld select, .fld textarea { border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface-2); min-height: 38px; padding: 7px 10px; width: 100%; }
.fld textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 2px var(--sel); }
.fld .ro { min-height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 2px; }
.fld .help { font-size: 11px; color: var(--muted); }
.fld.err input, .fld.err select, .fld.err textarea { border-color: var(--err); }
.fld .msg { font-size: 11px; color: var(--err); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; cursor: pointer; }
.check input { accent-color: var(--primary); margin: 0; }

.odoo { border: 1px solid var(--line); border-radius: var(--r-surf); padding: 12px 14px; display: grid; gap: 8px; background: var(--surface-2); }
.odoo .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.odoo.ok { background: var(--cyan-soft); border-color: transparent; }
.odoo.fail { background: var(--err-bg); border-color: transparent; }
.odoo.pend { background: var(--warn-bg); border-color: transparent; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; display: inline-block; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: rot .8s linear infinite; } @keyframes rot { to { transform: rotate(360deg); } } }

/* Estimación */
.est { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; align-items: start; }
.est > * { min-width: 0; }
.etool { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 8px; }
.etool .lb { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.gw { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); overflow: auto; max-height: calc(100vh - 230px); min-height: 280px; }
table.eg { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 640px; }
.eg th, .eg td { border-bottom: 1px solid var(--line-2); padding: 0; height: 36px; }
.eg thead th { position: sticky; top: 0; z-index: 3; background: var(--surface); font-size: 11px; font-weight: 600; text-align: center; border-bottom: 1px solid var(--line); height: 46px; padding: 0 4px; }
.eg thead th small { display: block; font-weight: 400; color: var(--muted); font-size: 9.5px; }
.eg .a { position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left; padding: 0 8px 0 10px; width: var(--gw-act); min-width: var(--gw-act); max-width: var(--gw-act); border-right: 1px solid var(--line); }
.eg thead .a { z-index: 4; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; }
.eg .p { width: 64px; min-width: 58px; text-align: right; border-right: 1px solid var(--line-2); }
.eg .t { width: 78px; min-width: 70px; text-align: right; padding-right: 10px; font-weight: 600; background: var(--surface-2); }
.eg thead .t { background: var(--surface-2); }
.eg tr.ph td { background: var(--row-ph); font-weight: 600; }
.eg tr.ph td.a { background: var(--row-ph); }
.eg tr.ph .pv { padding-right: 10px; font-size: 12px; }
.eg .phb { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; padding: 0; text-align: left; font-weight: 600; min-height: 36px; }
.eg .phb .ic { transition: transform .15s; }
.eg tr.ph.closed .phb .ic { transform: rotate(-90deg); }
.eg .an { display: flex; align-items: center; gap: 6px; min-width: 0; }
.eg .an .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; padding-left: 18px; }
.eg .an .txt small { color: var(--muted); font-size: 10px; margin-right: 6px; }
.eg .an .txt .ren { display: block; color: var(--muted); font-size: 10px; line-height: 1.2; }
.eg tr.act.renamed .an .txt { line-height: 1.2; }
.eg .rowbtn { border: 0; background: none; color: var(--muted); width: 26px; height: 26px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; flex: none; opacity: 0; }
.eg tr:hover .rowbtn, .eg .rowbtn:focus-visible { opacity: 1; }
@media (hover: none) { .eg .rowbtn { opacity: 1; } }
.eg .rowbtn:hover { background: var(--primary-soft); color: var(--primary); }
.eg input.h { width: 100%; height: 35px; border: 0; background: none; text-align: right; padding: 0 10px; outline: none; }
.eg input.h:focus { background: var(--primary-soft); box-shadow: inset 0 0 0 2px var(--focus); }
.eg input.h.z { color: var(--muted); }
.eg input.h.bad { background: var(--err-bg); color: var(--err); }
.eg .rov { padding: 0 10px; display: block; }
.eg .rov.z { color: var(--muted); }
.eg .mix { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--violet); margin-right: 5px; vertical-align: middle; }
.eg tfoot td { position: sticky; bottom: 0; z-index: 2; background: var(--surface); border-top: 1px solid var(--line); font-weight: 600; text-align: right; padding-right: 10px; height: 40px; }
.eg tfoot td.a { z-index: 3; text-align: left; padding-left: 10px; }
.eg tr.add td { height: 34px; }
.eg tr.add .addb { border: 0; background: none; color: var(--primary); font-size: 12px; font-weight: 500; padding: 0 0 0 28px; min-height: 34px; display: inline-flex; align-items: center; gap: 4px; }
.rename { position: fixed; z-index: 80; width: 340px; max-width: calc(100vw - 16px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); box-shadow: var(--shadow); padding: 12px; display: grid; gap: 10px; }
.rename h4 { margin: 0; font-size: 13px; font-weight: 600; }
.rename .orig { font-size: 11.5px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 6px 8px; }
.rename input[type=text] { border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface-2); min-height: 38px; padding: 7px 10px; width: 100%; }
.rename input:disabled { opacity: .55; }
.rename .acts { display: flex; justify-content: flex-end; gap: 6px; }

.side { display: grid; gap: 12px; position: sticky; top: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 14px; display: grid; gap: 10px; }
.card h3 { margin: 0; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card h3 small { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 11px; }
.prev { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.prev .ph { background: var(--navy); color: #fff; font-size: 11px; padding: 8px 10px; display: flex; justify-content: space-between; gap: 8px; }
.prev table { width: 100%; border-collapse: collapse; font-size: 12px; }
.prev td, .prev th { padding: 6px 10px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
.prev th { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; }
.prev .r { text-align: right; white-space: nowrap; }
.prev tr.g td { font-weight: 600; background: var(--surface-2); }
.prev tr.sub td:first-child { padding-left: 22px; }
.prev tr.tot td { font-weight: 600; font-size: 13px; border-bottom: 0; border-top: 2px solid var(--line); }
.prev .note { font-size: 11px; color: var(--muted); padding: 8px 10px; }
.odoo-lines { font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.mg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mg div { display: grid; gap: 1px; }
.mg span { font-size: 10.5px; color: var(--muted); }
.mg b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); position: relative; overflow: visible; border: 1px solid var(--line); }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--cyan); transition: width .3s ease; }
.bar i.low { background: var(--violet); }
.bar u { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.bar-l { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); }
.alert { background: var(--violet-soft); color: var(--violet-ink); border-radius: 8px; padding: 8px 10px; font-size: 12px; display: grid; gap: 6px; }
.adj { display: flex; align-items: center; gap: 8px; font-size: 12px; flex-wrap: wrap; }
.adj input { width: 70px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-height: 32px; padding: 0 8px; text-align: right; }
.lock { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.cost-row { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 10px; font-size: 11.5px; }
.cost-row span:nth-child(3n+2), .cost-row span:nth-child(3n) { text-align: right; }
.cost-row .hd { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }

.soonp { display: grid; gap: 12px; max-width: 760px; }
.soonp ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.badge-soon { font-size: 10.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; color: var(--muted); }

.wbsum { display: grid; gap: 6px; }
.wbsum .wp { font-weight: 600; font-size: 12.5px; }
.wbsum .wa { font-size: 12px; color: var(--muted); padding-left: 14px; }

.ddm { position: fixed; z-index: 80; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); box-shadow: var(--shadow); padding: 6px; min-width: 260px; max-width: calc(100vw - 16px); max-height: 60vh; overflow: auto; }
.ddm button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; }
.ddm button:hover, .ddm button:focus-visible { background: var(--primary-soft); }
.ddm button:disabled { opacity: .45; }
.ddm small { display: block; color: var(--muted); font-size: 11px; }
.ddm .gh { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 10px 2px; }
.toast { position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 90; background: var(--navy); color: #fff; border-radius: 10px; padding: 9px 16px; font-size: 12.5px; box-shadow: var(--shadow); max-width: calc(100vw - 24px); }
.toast.err { background: var(--err); }
.foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

@media (prefers-reduced-motion: no-preference) {
  .view { animation: vin .22s ease-out; }
  @keyframes vin { from { opacity: 0; transform: translateY(6px); } }
  .ddm, .rename { animation: pop .14s ease-out; } @keyframes pop { from { opacity: 0; transform: translateY(4px); } }
  tr.flash td { animation: fl .9s ease-out; } @keyframes fl { from { background: var(--cyan-soft); } }
}
@media (max-width: 1100px) { .est { grid-template-columns: minmax(0, 1fr); } .side { position: static; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); } }
@media (max-width: 760px) {
  .page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

html.emb .page { padding-top: 4px; }
@media (max-width: 1280px) { .wg3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1100px) { .wk { grid-template-columns: repeat(3, minmax(0, 1fr)); } .wg2 { grid-template-columns: minmax(0, 1fr); } .pvn { display: none; } }
@media (max-width: 760px) {
  .wk { grid-template-columns: repeat(2, minmax(0, 1fr)); } .wk .kpi:last-child { grid-column: 1 / -1; }
  .wg3 { grid-template-columns: minmax(0, 1fr); } .form.w4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .qp { flex: 1 1 140px; } .wsg { grid-template-columns: minmax(0, 1fr); }

}

.qh .qid { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; }
.panel h2.wh { margin-bottom: 10px; }
.fld > .seg { justify-self: start; }

html.emb .head.lh > div:first-child { display: none; }
html.emb .head.lh { justify-content: flex-end; margin-bottom: 12px; }
/* v2.1: componentes, suministro, lo que recibe el cliente, borrador */
.wcp { display: grid; gap: 8px; }
.wcr { display: flex; gap: 12px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; flex-wrap: wrap; }
.wcr.on { border-color: color-mix(in srgb, var(--primary) 45%, var(--line)); background: color-mix(in srgb, var(--primary-soft) 45%, var(--surface)); }
.wcr > div:first-child { flex: 1 1 220px; min-width: 0; } .wcr b { display: block; font-size: 13px; }
.wsu select, .wsu input[type=text] { width: 100%; min-width: 150px; min-height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-size: 12.5px; padding: 3px 6px; }

.wsu .wsc { margin-top: 4px; }

.wnew { display: inline-block; margin-top: 4px; font-size: 10.5px; font-weight: 600; color: var(--warn-ink); background: var(--warn-bg); border-radius: 999px; padding: 1px 8px; }
.pcz { font-size: 11.5px; font-weight: 600; color: var(--warn-ink); background: var(--warn-bg); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.wcli .wsh { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.wg2.eq { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); }
.wcli { margin-bottom: 12px; }
.pvpage.draft::after { content: "BORRADOR"; position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg); font-size: 86px; font-weight: 700; letter-spacing: .08em; color: rgba(176, 53, 60, .13); pointer-events: none; }
.pvpage .ppc { font-style: normal; font-weight: 600; color: #8a4b00; }
@media (max-width: 1100px) { .wg2.eq { grid-template-columns: minmax(0, 1fr); } }
.wcq { margin-top: 12px; }
.wcg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

.wcc.on { border-color: color-mix(in srgb, var(--primary) 40%, var(--line)); background: color-mix(in srgb, var(--primary-soft) 40%, var(--surface)); }
.wcc > b { font-size: 14px; }
.wcc .wq { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line-2); }
.wcc .wq .lb { font-size: 12px; font-weight: 600; color: var(--ink); }
.wcc .seg { align-self: flex-start; }
@media (max-width: 900px) { .wcg { grid-template-columns: minmax(0, 1fr); } }

/* botones de IA simulados (omnIA) */

.btn.aib { border-radius: 999px; border-color: #9be9f7; background: linear-gradient(90deg, color-mix(in srgb, #00dcfa 14%, var(--surface)), color-mix(in srgb, #0a58eb 10%, var(--surface))); padding-left: 8px; gap: 8px; font-weight: 500; }
.btn.aib:hover { box-shadow: 0 0 0 3px rgba(0, 220, 250, .25); }
.aiorb { width: 18px; height: 18px; border-radius: 50%; flex: none; background: radial-gradient(circle at 40% 35%, #00dcfa 0, #0a58eb 38%, #001c3f 78%); }

/* Lista: entre 761 y 899 px la tabla se oculta y deben verse las tarjetas (la regla base .cards quedaba despues y las tapaba) */
