<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* Layout: cabecera del modulo, pestanas por seccion y contenido de una columna; edicion de persona en hoja lateral.
   Tokens del Ecosistema (design/planeacion-v1). */
:root {
  color-scheme: light;
  --font: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --navy: #001c3f; --bright: #0a58eb; --cyan: #00dcfa; --cyan-ink: #007f93;
  --bg: #f2f5f9; --surface: #fff; --surface-2: #f6f8fb; --ink: #001c3f; --muted: #556578; --line: #dbe2ea; --line-2: #eef2f6;
  --primary: #002473; --primary-ink: #fff; --primary-soft: #e8eefc; --focus: #0a58eb;
  --ok-bg: #e5f7ee; --ok-ink: #145a37; --warn-bg: #fff4e0; --warn-ink: #7a4a00; --err-bg: #fbeaeb; --err-ink: #b0353c;
  --approval: #7543ff; --approval-soft: #f1ecff; --off-bg: #e9edf2; --off-ink: #8593a5;
  --admin: #001c3f; --admin-ink: #fff;
  --shadow: 0 12px 32px rgba(0,28,63,.18); --shadow-sm: 0 2px 8px rgba(0,28,63,.08);
  --r-ctl: 8px; --r-surf: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #07111f; --surface: #0d1b2f; --surface-2: #112339; --ink: #e7eef7; --muted: #9db0c5; --line: #22385a; --line-2: #182b45;
  --primary: #5d8dff; --primary-ink: #04122a; --primary-soft: #16294a; --focus: #7fb0ff; --bright: #7fb0ff; --cyan-ink: #5fe6fb;
  --ok-bg: #0e3324; --ok-ink: #8fe3b6; --warn-bg: #3a2a0c; --warn-ink: #ffd28a; --err-bg: #3d1519; --err-ink: #ff7a80;
  --approval: #a98bff; --approval-soft: #221a45; --off-bg: #132439; --off-ink: #5f738c; --navy: #020c1a;
  --admin: #00dcfa; --admin-ink: #02121f;
  --shadow: 0 12px 32px rgba(0,0,0,.55); --shadow-sm: 0 2px 8px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #07111f; --surface: #0d1b2f; --surface-2: #112339; --ink: #e7eef7; --muted: #9db0c5; --line: #22385a; --line-2: #182b45;
  --primary: #5d8dff; --primary-ink: #04122a; --primary-soft: #16294a; --focus: #7fb0ff; --bright: #7fb0ff; --cyan-ink: #5fe6fb;
  --ok-bg: #0e3324; --ok-ink: #8fe3b6; --warn-bg: #3a2a0c; --warn-ink: #ffd28a; --err-bg: #3d1519; --err-ink: #ff7a80;
  --approval: #a98bff; --approval-soft: #221a45; --off-bg: #132439; --off-ink: #5f738c; --navy: #020c1a;
  --admin: #00dcfa; --admin-ink: #02121f;
  --shadow: 0 12px 32px rgba(0,0,0,.55); --shadow-sm: 0 2px 8px rgba(0,0,0,.4); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1180px; margin: 0 auto; padding-block: 24px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.head h1 { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.head p { color: var(--muted); font-size: 13px; max-width: 70ch; }
.me-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { padding: 10px 14px; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-color: var(--cyan); }
.count { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--r-ctl); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn.primary { background: var(--primary); color: var(--primary-ink); }
.btn.ghost { border: 1px solid var(--line); background: var(--surface); }
.btn.ghost:hover:not(:disabled) { border-color: var(--bright); }
.btn.danger { border: 1px solid var(--err-ink); color: var(--err-ink); background: var(--surface); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.link { color: var(--bright); font-weight: 500; font-size: 13px; }
.link:hover { text-decoration: underline; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: var(--off-bg); color: var(--off-ink); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok-ink); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
.pill.pri { background: var(--primary-soft); color: var(--primary); }
.pill.adm { background: var(--admin); color: var(--admin-ink); }
.pill.prop { background: transparent; border: 1px dashed var(--approval); color: var(--approval); }
.pill.sim { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); }

.banner { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; border-radius: var(--r-surf); border: 1px solid var(--line); background: var(--surface); }
.banner .txt { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.banner b { font-weight: 600; font-size: 13.5px; }
.banner span { font-size: 12.5px; color: var(--muted); }
.banner.warn { background: var(--warn-bg); border-color: transparent; }
.banner.warn b, .banner.warn span { color: var(--warn-ink); }
.banner .b-ic { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: var(--primary-soft); color: var(--primary); flex: none; }
.banner.warn .b-ic { background: rgba(122,74,0,.12); color: var(--warn-ink); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.card-h h2 { font-size: 15px; font-weight: 600; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); padding: 0 10px; flex: 1 1 220px; max-width: 320px; color: var(--muted); }
.search input { border: 0; background: transparent; padding: 8px 0; min-width: 0; flex: 1; color: var(--ink); outline: none; }
.chip { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.chip .n { opacity: .7; }
select.f, input.f { border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); padding: 8px 10px; min-width: 0; color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-ctl); overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { padding: 7px 14px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); font-weight: 600; }

/* Personas */
.av { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex: none; background: var(--navy); display: inline-flex; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av .ini { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 12px; }
.av.lg { width: 56px; height: 56px; }
.who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.who div { min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.who b { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { font-size: 11.5px; color: var(--muted); }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-surf); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
td { padding: 10px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--surface-2); }
tr.row.sel td { background: var(--primary-soft); }
.caps { display: flex; flex-wrap: wrap; gap: 4px; }
.cap { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.cap.extra { border-style: dashed; border-color: var(--bright); color: var(--bright); background: transparent; }
.cap.adm { background: var(--admin); color: var(--admin-ink); border-color: transparent; }
.dash { color: var(--off-ink); }

/* Matriz de roles */
.mx td.c, .mx th.c { text-align: center; }
.mx .yes { color: var(--ok-ink); }
.mx .per { font-size: 11.5px; color: var(--muted); }

/* Hoja lateral de edicion */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,28,63,.28); z-index: 40; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 41; display: flex; flex-direction: column; }
.sheet-h { display: flex; gap: 12px; align-items: center; padding: calc(16px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 16px 18px; border-bottom: 1px solid var(--line); }
.sheet-h .x { margin-left: auto; width: 36px; height: 36px; border-radius: var(--r-ctl); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.sheet-h .x:hover { background: var(--surface-2); color: var(--ink); }
.sheet-b { flex: 1; overflow-y: auto; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 18px 18px; display: flex; flex-direction: column; gap: 18px; }
.sheet-f { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px max(18px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) 18px; border-top: 1px solid var(--line); align-items: center; }
.sheet-f .note { margin-right: auto; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lbl { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 12.5px; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; }
.opts { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-surf); overflow: hidden; }
.opt { display: grid; grid-template-columns: 20px 1fr auto; gap: 12px; align-items: start; padding: 12px 14px; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.opt:last-child { border-bottom: 0; }
.opt input { margin: 3px 0 0; width: 16px; height: 16px; accent-color: var(--primary); }
.opt b { font-weight: 500; font-size: 13.5px; display: block; }
.opt small { color: var(--muted); font-size: 12px; }
.opt.locked { cursor: default; background: var(--surface-2); }
.opt .src { font-size: 11px; color: var(--muted); white-space: nowrap; }
.opt.adm b { font-weight: 600; }
.guard { font-size: 12px; color: var(--warn-ink); background: var(--warn-bg); border-radius: var(--r-ctl); padding: 8px 10px; }
.confirm { border: 1px solid var(--err-ink); border-radius: var(--r-surf); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; background: var(--err-bg); color: var(--err-ink); font-size: 13px; }
.confirm .row-b { display: flex; gap: 8px; flex-wrap: wrap; }

/* WBS */
.phases { display: flex; flex-direction: column; gap: 10px; }
.phase { border: 1px solid var(--line); border-radius: var(--r-surf); background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.phase.off { background: var(--surface-2); border-style: dashed; }
.phase-h { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.phase-h .ord { font-size: 12px; color: var(--muted); width: 22px; }
.phase-h h3 { font-size: 14px; font-weight: 600; flex: 1 1 160px; min-width: 0; }
.phase.off h3 { color: var(--off-ink); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.act { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 4px 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); }
.act.off { text-decoration: line-through; color: var(--off-ink); }
.act button { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.act button:hover { background: var(--line-2); color: var(--ink); }
.act button .ic { width: 12px; height: 12px; }
.add-in { display: inline-flex; gap: 6px; align-items: center; }
.add-in input { width: 180px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; }

/* omnIA */
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.meter { position: relative; height: 8px; border-radius: 999px; background: var(--line-2); min-width: 120px; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--bright); }
.meter i.warn { background: #e3a008; }
.meter i.full { background: var(--err-ink); }
.meter em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--muted); opacity: .6; }
.num { font-weight: 600; }
.types { display: flex; flex-wrap: wrap; gap: 6px; }

/* Preferencias */
.pref { display: grid; grid-template-columns: minmax(160px, 220px) 1fr; gap: 10px 20px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line-2); }
.pref:last-child { border-bottom: 0; }
.pref .l b { display: block; font-weight: 500; font-size: 13.5px; }
.pref .l small { color: var(--muted); font-size: 12px; }
.pref .r { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.sw { position: relative; width: 38px; height: 22px; border-radius: 999px; background: var(--line); flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: var(--shadow-sm); }
.sw[aria-checked="true"] { background: var(--primary); }
.sw[aria-checked="true"]::after { transform: translateX(16px); }

/* Registro */
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 140px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.log li:last-child { border-bottom: 0; }
.log time { color: var(--muted); font-size: 12px; }
.log b { font-weight: 600; }

.empty { padding: 40px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r-surf); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: var(--r-ctl); font-size: 13px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

@media (max-width: 720px) {
  .pref { grid-template-columns: 1fr; }
  .log li { grid-template-columns: 1fr; gap: 2px; }
  .hide-sm { display: none; }
  td, th { padding: 9px 10px; }
}
@media (prefers-reduced-motion: reduce) { .sw::after { transition: none; } }
</style>
</head>

  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>

<div class="wrap" id="app"></div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var SH = window.KAIROS_SHELL, HOST = window.KAIROS_HOST;
  if (!SH || !HOST || !HOST.cfg) {
    $('app').innerHTML = '<div class="empty">Configuración se abre dentro del Ecosistema de Kairos, con una sesión iniciada.</div>';
    return;
  }

  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var tt;
  function toast(t) { var el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(function () { el.hidden = true; }, 2600); }
  var LS = 'kairos.settings';
  function sGet() {
    try { var s = JSON.parse(localStorage.getItem(LS)); if (s && s.v === 1) return s; } catch (e) {}
    return seedSettings();
  }
  function sSave() { try { localStorage.setItem(LS, JSON.stringify(ST)); } catch (e) {} }

  /* ---------- Datos de ejemplo ---------- */
  function seedSettings() {
    function ph(name, acts) { return { name: name, on: true, acts: acts.map(function (a) { return { name: a, on: true }; }) }; }
    return { v: 1,
      wbs: {
        SM: [ph('Levantamiento', ['Visita a planta', 'Levantamiento de requisitos', 'Diagnóstico de datos']),
             ph('Diseño', ['Diseño funcional MES', 'Arquitectura de integración', 'Modelo de datos']),
             ph('Desarrollo', ['Configuración MES', 'Integración con ERP', 'Tableros OEE']),
             ph('Pruebas', ['FAT', 'SAT']),
             ph('Puesta en marcha', ['Arranque asistido', 'Capacitación a usuarios']),
             ph('Cierre', ['Documentación as built', 'Acta de entrega'])],
        AU: [ph('Ingeniería', ['Diseño eléctrico', 'Diseño de PLC', 'Listado de señales']),
             ph('Programación', ['Programación PLC', 'HMI / SCADA']),
             ph('Montaje', ['Supervisión de montaje', 'Pruebas en vacío']),
             ph('Puesta en marcha', ['Pruebas con proceso', 'Ajustes de lazo', 'Capacitación']),
             ph('Cierre', ['Documentación as built'])],
        CO: [ph('Diagnóstico', ['Entrevistas', 'Evaluación de madurez']),
             ph('Hoja de ruta', ['Priorización de iniciativas', 'Plan por fases']),
             ph('Acompañamiento', ['Comités de seguimiento'])]
      },
      omnia: { limit: 50, warn: 80, reviewer: '' },
      prefs: {}
    };

      var KK = KM(); if (!KK || !isAdmin()) { toast('Solo quien tiene Administrar cambia los márgenes'); return; }
      var mm = { alcance: {}, horas: {}, suministro: {} }, bad = false;
      Array.prototype.forEach.call(f.querySelectorAll('[data-mg]'), function (i) { var k = i.dataset.mg.split('|'), v = parseInt(i.value, 10); if (!(v >= 0 && v <= 90)) bad = true; mm[k[0]][k[1]] = v; });
      if (bad) { toast('Cada margen debe estar entre 0 y 90 %'); return; }
      KK.setMargenes(mm); render(); toast('Márgenes mínimos guardados'); return;
    }
    if (f.id === 'segForm') {
      var E = SEGE(); if (!E || !isAdmin()) { toast('Solo quien tiene Administrar cambia los umbrales'); return; }
      var er = E.setUmbrales({ imp: $('segImp').value, crit: $('segCrit').value, sinReporte: $('segRep').checked });
      if (er) { toast(er); return; }
      render(); toast('Umbrales de alertas guardados'); return;
    }
    if (f.id === 'omForm') {
      var lim = parseInt($('omLim').value, 10);
      if (!(lim >= 5 && lim <= 500)) { toast('El límite debe estar entre 5 y 500 interacciones'); $('omLim').focus(); return; }
      ST.omnia = { limit: lim, warn: parseInt($('omWarn').value, 10), reviewer: $('omRev').value }; sSave(); render(); toast('Límites de omnIA guardados'); return;
    }
    if (f.dataset.addPhase) {
      v = $('np').value.trim(); if (!v) { $('np').focus(); return; }
      ST.wbs[ui.unit].push({ name: v, on: true, acts: [] }); sSave(); render(); toast('Fase agregada: ' + v); return;
    }
    if (f.dataset.addAct != null) {
      var i = +f.dataset.addAct, inp = $('na' + i); v = inp.value.trim(); if (!v) { inp.focus(); return; }
      ST.wbs[ui.unit][i].acts.push({ name: v, on: true }); sSave(); render();
      var n = $('na' + i); if (n) n.focus();
    }
  });

  render();
})();
</script>
</body>
</html>
