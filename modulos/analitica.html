:root {

  --primary: #5d8dff; --primary-ink: #04122a; --primary-soft: #16294a; --focus: #7fb0ff; --bright: #7fb0ff;
  --ok-bg: #0e3324; --ok-ink: #8fe3b6; --ok: #3fc98a; --warn-bg: #3a2a0c; --warn-ink: #ffd28a; --warn: #f0b440; --err-bg: #3d1519; --err-ink: #ff7a80; --err: #ff6b73;
  --p-E3: #5d8dff; --exec: #5d8dff; --quot: #4a5d78; --rest: #3fc98a; --over: #ff6b73; --off-bg: #132439; --off-ink: #7a8ea6;

  --primary: #5d8dff; --primary-ink: #04122a; --primary-soft: #16294a; --focus: #7fb0ff; --bright: #7fb0ff;

.al .t { flex: 1 1 220px; min-width: 0; }
.al .btn { padding: 3px 10px; font-size: 12px; }

.grid { display: grid; column-gap: 16px; align-items: center; padding: 0 16px; }

.wk { position: relative; flex: 1 0 104px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 7px 10px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface); }

.state { text-align: center; padding: 40px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.state h3 { color: var(--ink); }

.cm { display: flex; flex-direction: column; gap: 8px; } .cm .c { border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 8px 12px; font-size: 13px; background: var(--surface-2); }

.ph { border-style: dashed; }
svg text.halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
svg[role=img] { display: block; max-width: 820px; margin-inline: auto; overflow: visible; } svg text { font-family: var(--font); fill: var(--ink); }
/* movimiento: solo al entrar a una vista, luego quieto */

.anim .num { animation: count 1.1s cubic-bezier(.2,.7,.2,1) both; animation-delay: .2s; }
.anim .rise { animation: rise .55s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 60ms); }
.anim .grow { transform-origin: left center; animation: grow .9s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(.25s + var(--i, 0) * 60ms); }
.anim .up { transform-box: fill-box; transform-origin: center bottom; animation: up .8s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(.2s + var(--i, 0) * 80ms); }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes up { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes segd { from { stroke-dasharray: 0 340; } }

    var name = '<span><button class="lnk" data-rgopen="' + E(k1) + '" aria-expanded="' + o1 + '">' + (o1 ? '▾ ' : '▸ ') + '<b>' + E(g.key) + '</b></button>' + (RG.by === 'regional' ? '<br><small class="muted">' + E(resp[g.key] || 'Sin responsable') + '</small>' : '') + '</span>';
    h += line(name, g.s, 'rw');
    if (!o1) return;
    R.agrupar(g.rows, sub).forEach(function (s2) {
      var k2 = k1 + '>' + s2.key, o2 = !!RG.open[k2];
      h += line('<span><button class="lnk" data-rgopen="' + E(k2) + '" aria-expanded="' + o2 + '">' + (o2 ? '▾ ' : '▸ ') + E(s2.key) + '</button></span>', s2.s, 'rw rgsub', '', 36);
      if (!o2) return;
      s2.rows.forEach(function (r) { h += line('<span><span class="mono">' + E(r.code) + '</span> ' + E(r.name) + '<br><small class="muted">' + E(r.cliente) + ' · ' + E(r.currency) + '</small></span>', R.resumen([r]), 'rw rgsub', '', 56); });
    });
  });
  h += '</div></div><div class="cardf"><span>Vendido con la TRM de hoy y facturado con la TRM de cada factura, consolidados en ' + cur + '. Ocupación: horas reservadas esta semana en esos CECO sobre la capacidad de las personas de sus equipos.</span>' + simTag() + '</div></section>';
  return h;
  function rgK(l, v, c) { return '<div class="kpi"><span class="sm muted">' + l + '</span><span class="v" style="font-size:24px">' + v + '</span><span class="causa">' + E(c) + '</span></div>'; }
}
document.addEventListener('change', function (ev) { var d = ev.target.dataset || {}; if (!d.rg) return; RG[d.rg] = ev.target.value || (d.rg === 'cl' ? null : ''); if (d.rg === 'cl') { RG.reg = ''; RG.lid = ''; RG.cli = ''; } RG.open = {}; render(); });
document.addEventListener('click', function (ev) { var f = ev.target.closest('[data-fcgo]'); if (f && SH && SH.go) { SH.go('forecast'); return; } });
document.addEventListener('click', function (ev) { var t = ev.target.closest('[data-rgby],[data-rgopen]'); if (!t) return; if (t.dataset.rgby) { RG.by = t.dataset.rgby; RG.open = {}; } else { var k = t.dataset.rgopen; RG.open[k] = !RG.open[k]; } render(); });
/* Forecast y Backlog dentro de Analitica: los Tableros del modulo, embebidos y completos; la grilla y el cierre siguen en el modulo */
function forecastView() {
  var side = SH && SH.go ? '<button class="btn" data-fcgo="1">Abrir el módulo · grilla, movimientos y cierre</button>' : '';
  var h = headHTML('Analítica', 'Forecast y Backlog · proyección de facturación por cluster, regional, líder y cliente', side) + navTabs('forecast');
  return h + '<iframe class="fc-emb" src="forecast.html#tableros&embed" title="Forecast y Backlog · Tableros" style="display:block;width:100%;min-height:900px;border:0;background:transparent"></iframe>';
}
/* Rentabilidad de cotizaciones [ACORDADO 04-nov, boceto 49]: tablero de Cotizaciones embebido; el lider de cluster lo abre desde la aprobacion */
function rentcotView() {
  return headHTML('Analítica', 'Rentabilidad de cotizaciones · margen cotizado frente al mínimo, por cluster, unidad y regional') + navTabs('rentcot') + '<iframe class="rc-emb" src="cotizaciones.html#rent&embed" title="Rentabilidad de cotizaciones" style="display:block;width:100%;min-height:640px;border:0;background:transparent"></iframe>';
}
function parseHash() {
  var h = (location.hash || '').slice(1).replace(/^embed-/, 'p-'), mm = /^p-(.+?)(?:-(horas|costos|facturacion|negocio))?$/.exec(h);
  if (mm) { S.id = mm[1]; S.kpi = mm[2] || null; S.view = S.kpi === 'negocio' ? 'negproy' : S.kpi ? 'detalle' : 'proyecto'; }
  else { var v = TOP.indexOf(h) >= 0 && can(h) ? h : home(); S.view = v; S.id = null; S.kpi = null; }
}
function navigate(id, tgt) { var h = TOP.indexOf(id) >= 0 ? '#' + id : (EMB ? '#embed-' : '#p-') + id + (tgt ? '-' + tgt : ''); if (location.hash === h) render(); else location.hash = h; }
function skeleton() { return '<div class="head"><div><h1>Analítica</h1><p>Cargando indicadores…</p></div></div><div style="display:flex;flex-direction:column;gap:12px" aria-busy="true">' + [1, 2, 3, 4].map(function () { return '<div class="sk"></div>'; }).join('') + '</div>'; }
function render() {
  var key = S.view + '|' + S.id + '|' + S.kpi, y = lastKey === key ? window.scrollY : 0, h;
  if (S.view === 'forecast' && lastKey === key && $app.querySelector('iframe.fc-emb')) return; /* no recargar los Tableros embebidos */
  if (S.view === 'rentcot' && lastKey === key && $app.querySelector('iframe.rc-emb')) return;
  if (!home() && !(EMB && can('cartera'))) h = stateBox('Sin permiso', 'Analítica está disponible para Dirección, Planeación, Solution Design, líderes y administración.');
  else if (S.loading) h = skeleton();
  else if (S.fail) h = stateBox('No se pudo cargar la analítica', 'Revisa la conexión e intenta de nuevo.') + '<div style="text-align:center"><button class="btn pri" data-reload="1">Reintentar</button></div>';
  else {
    try {
      if (S.view === 'general') h = generalView();
      else if (S.view === 'cartera') h = carteraView();
      else if (S.view === 'regionales') h = regionalesView();
      else if (S.view === 'ocupacion') h = ocupacionView();
      else if (S.view === 'negocio') h = negocioView();
      else if (S.view === 'forecast') h = forecastView();
      else if (S.view === 'rentcot') h = rentcotView();
      else {
        var u = findUnit(S.units, S.id), back = '<div class="crumb"><button data-go="' + (home() || 'cartera') + '">' + ic('back') + 'Analítica</button></div>';
        if (!u) h = back + stateBox('No encontramos este proyecto', 'Puede haber cambiado de estado o no estar en tu cartera.');
        else if (S.view === 'negproy') h = canNeg(u) ? negocioProyView(u) : back + stateBox('Sin permiso', 'El análisis de negocio de este proyecto lo ven Solution Design, la gerencia y su líder.');
        else h = canDetail(u) ? (S.view === 'proyecto' ? proyectoView(u) : detalleView(u, S.kpi)) : back + stateBox('Sin permiso', 'Este proyecto lo ven la gerencia, Planeación y su líder.');
      }
    } catch (err) { h = stateBox('Algo salió mal al armar esta vista', E(err.message)); }
  }
  var fresh = !S.loading && key !== lastKey;
  $app.classList.toggle('anim', fresh);
  $app.innerHTML = h; if (!S.loading) lastKey = key; window.scrollTo(0, y);
  if (EMB) { try { window.parent.postMessage({ kx: 'h', h: document.documentElement.scrollHeight + 8 }, '*'); } catch (e) {} }
}
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-go],[data-tw],[data-mine],[data-act],[data-av],[data-cm],[data-retry],[data-per],[data-cut],[data-more],[data-reload],[data-wf],[data-tipo],[data-ncut],[data-ost],[data-ow],[data-onav],[data-fclr]'); if (!t || t.disabled) return;
  var d = t.dataset;
  if (d.tipo) { S.tipo = d.tipo; render(); return; }
  if (d.fclr) { if (d.fclr === 'rg') { RG.reg = RG.lid = RG.cli = ''; } else { S.tipo = 'todos'; S.fEst = 'activo'; S.fCli = ''; S.fUn = ''; } render(); return; }
  if (d.ncut) { S.ncut = d.ncut; render(); return; }
  if (d.ost) { S.occ.st = d.ost; render(); return; }
  if (d.ow) { occClick(+d.ow); render(); return; }
  if (d.onav) { var o = occData(); S.occ.from = Math.max(1, Math.min(o.cur.week - 9, S.occ.from + (+d.onav) * 5)); render(); return; }
  if (d.wf) { ev.preventDefault(); var w = document.getElementById('wf'); if (w) w.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (d.go) { var p = d.go.split('|'); S.child = 'todos'; if (p[0] !== S.id) S.cut = {}; navigate(p[0], p[1]); window.scrollTo(0, 0); }
  else if (d.tw) { S.open[d.tw] = !S.open[d.tw]; render(); }
  else if (d.mine) { S.mine = d.mine === '1'; render(); }
  else if (d.av) gotoAvance(d.av);
  else if (d.act) { var a = d.act.split(':'); if (a[0] === 'av') gotoAvance(a[1]); else if (a[0] === 'go') { var q = a[1].split('|'); navigate(q[0], q[1]); } else { var w2 = document.getElementById('wf'); if (w2) w2.scrollIntoView({ behavior: 'smooth' }); } }
  else if (d.cm) { var ta = document.getElementById('cmt'); if (ta && ta.value.trim()) { addCm(d.cm, ta.value.trim()); render(); } }
  else if (d.retry) { S.errOdoo = false; render(); }
  else if (d.per) { S.per.mode = d.per; render(); }
  else if (d.cut) { var k = S.kpi === 'horas' ? 'horas' : S.kpi === 'costos' ? 'costos' : 'fact'; S.cut[k] = d.cut; render(); }
  else if (d.more) { S.more[d.more] = true; render(); }
  else if (d.reload) init();
});
document.addEventListener('change', function (ev) {
  var t = ev.target, d = t.dataset;
  if (d.f) { S[d.f] = t.value; render(); }
  else if (d.child) { S.child = t.value; render(); }
  else if (d.pv) { S.per[d.pv] = d.pv === 'w' ? t.value : +t.value; render(); }
  else if (d.cum) { S.cum = t.checked; render(); }
});
document.addEventListener('input', function (ev) {
  var t = ev.target; if (!t.dataset || !t.dataset.oq) return;
  S.occ.q = t.value; render(); var el = document.getElementById('oq'); if (el) { el.focus(); var n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) {} }
});
if (EMB) { document.body.style.paddingTop = '0'; document.body.style.background = 'transparent'; }
window.addEventListener('hashchange', function () { parseHash(); render(); });
function init() {
  S.loading = true; S.fail = false; parseHash(); render();
  setTimeout(function () {
    try {
      var projs = loadProjects(); SIM = {}; CACHE = {}; NEG = null; OCC = null;
      projs.forEach(function (p) { SIM[p.id] = simulate(p); });
      S.units = buildUnits(projs);
      if (S.mine == null) S.mine = false;
      S.loading = false;
    } catch (e) { S.loading = false; S.fail = true; }
    render();
  }, 350);
}
init();
})();
